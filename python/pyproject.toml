[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tapp-con"
version = "0.1.0"
description = "NumPy port of the TAPP-Con constrained block-sparse tensor GEMM library"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools]
packages = ["tapp_con", "tapp_con.constraint"]
